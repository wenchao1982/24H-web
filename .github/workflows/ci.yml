name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 首次提交尚无 package-lock.json，用 npm install；锁定后改回 npm ci。
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
