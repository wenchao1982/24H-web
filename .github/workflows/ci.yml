name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 在 monorepo 根安装（npm workspaces 会链接 apps/* 与 packages/*）。
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
